name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macOS 26 (arm64) with Xcode 26: the package needs Swift 6.2.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # build.sh numbers the build by commit count

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build (release)
        run: swift build -c release

      # Fixture tests create and attach small disk images with hdiutil and skip (never fail) when that is not possible.
      # With CI=true (set by GitHub) the EjectWatcher timing tests and the GUI test-app tests skip too; see
      # Tests/EjectKitTests/Fixture.swift. Nothing here touches a real disk.
      - name: Test
        run: swift test

      - name: Build Ejectable.app
        run: ./build.sh

      - name: Zip app
        run: ditto -c -k --keepParent build/Ejectable.app "Ejectable-${GITHUB_SHA::7}.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: Ejectable-${{ github.sha }}
          path: Ejectable-*.zip
          if-no-files-found: error
          retention-days: 14
